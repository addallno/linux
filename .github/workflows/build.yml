name: build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hoolock
          path: cfg
      - uses: actions/checkout@v4
        with:
          ref: n56base
          path: src
          fetch-depth: 1
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm flex bison libelf-dev libssl-dev bc
      - name: config
        run: |
          cd src
          cp ../cfg/ikconfig_n56.config .config
          ./scripts/config --disable USB_ETH
          make LLVM=1 ARCH=arm64 olddefconfig
          echo "=== USB 关键项 ==="
          grep -E 'CONFIG_USB_ETH|CONFIG_USB_CONFIGFS_SERIAL|CONFIG_USB_CONFIGFS=|CONFIG_USB_F_SERIAL' .config
      - name: build
        run: cd src && make LLVM=1 ARCH=arm64 -j$(nproc) Image
      - name: version
        run: cat src/include/config/kernel.release || true
      - uses: actions/upload-artifact@v4
        with:
          name: Image
          path: src/arch/arm64/boot/Image
